<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Journal Book Body -->
  <g filter="url(#shadow)">
    <!-- Book Back Pages Cover -->
    <rect x="110" y="90" width="292" height="332" rx="20" fill="#FFFFFF" opacity="0.9" />

    <!-- Main Cover -->
    <rect x="126" y="90" width="276" height="332" rx="20" fill="#3730A3" />

    <!-- Spine Binding Lines / Rings -->
    <rect x="126" y="90" width="32" height="332" fill="#312E81" />
    <circle cx="142" cy="140" r="8" fill="#E0E7FF" opacity="0.8" />
    <circle cx="142" cy="210" r="8" fill="#E0E7FF" opacity="0.8" />
    <circle cx="142" cy="280" r="8" fill="#E0E7FF" opacity="0.8" />
    <circle cx="142" cy="350" r="8" fill="#E0E7FF" opacity="0.8" />

    <!-- Bookmark Ribbon -->
    <path d="M 280 90 L 320 90 L 320 240 L 300 220 L 280 240 Z" fill="url(#ribbonGrad)" />

    <!-- Journal Cover Emblem/Lines -->
    <rect x="186" y="160" width="160" height="12" rx="6" fill="#818CF8" opacity="0.6" />
    <rect x="186" y="196" width="120" height="12" rx="6" fill="#818CF8" opacity="0.6" />
    
    <!-- Pen Element -->
    <g transform="translate(320, 260) rotate(-35)">
      <rect x="0" y="0" width="20" height="120" rx="6" fill="#F43F5E" />
      <polygon points="0,120 20,120 10,145" fill="#FDA4AF" />
      <polygon points="7,138 13,138 10,145" fill="#1E293B" />
      <rect x="0" y="0" width="20" height="25" rx="3" fill="#E2E8F0" />
    </g>
  </g>
</svg>
